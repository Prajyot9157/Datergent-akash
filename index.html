      <label>To<input type="date" id="salesTo" value="${f.to}"></label>
      <label>Customer<select id="salesCustomer"><option value="">All customers</option>${customers.map(c=>`<option value="${c.value}"${f.customerId===c.value?' selected':''}>${U.esc(c.label)}</option>`).join('')}</select></label>
      <label>Product<select id="salesProduct"><option value="">All products</option>${products.map(p=>`<option value="${p.value}"${f.productId===p.value?' selected':''}>${U.esc(p.label)}</option>`).join('')}</select></label>
    </div>
    <div class="row wrap" style="margin-top:.5rem">
      <button class="btn sm" id="salesClear">Clear</button>
      <button class="btn sm" id="salesExport">⬇ Export CSV</button>
      <button class="btn sm" data-add-return>↩ Return</button>
    </div>
  </div>
  ${rows.length?`<div class="card tight"><div class="table-wrap"><table><thead><tr><th>Date</th><th>Invoice</th><th>Customer</th><th class="num">Total</th><th class="num">Paid</th><th class="num">Pending</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(s=>{const st=Views.saleStatus(s);const hasDel=DB.all('deliveries').some(d=>d.saleId===s.id);const hasRet=DB.all('salesReturns').some(r=>r.saleId===s.id);return `<tr><td class="nowrap">${U.date(s.date)}${hasDel?' 🚚':''}${hasRet?' ↩':''}</td><td class="nowrap"><a href="#/sale/${s.id}">${U.esc(s.number||'—')}</a></td><td>${U.esc(Views.customerName(s.customerId))}</td><td class="num">${U.money0(s.total)}</td><td class="num">${U.money0(s.paid)}</td><td class="num ${(s.total-s.paid)>0?'neg':''}">${U.money0(s.total-s.paid)}</td><td>${Views.badge(st)}</td><td class="right nowrap"><button class="btn ghost sm" data-view-sale="${s.id}">👁</button><button class="btn ghost sm" data-edit-sale="${s.id}">✏️</button><button class="btn ghost sm" data-del-sale="${s.id}">🗑</button></td></tr>`}).join('')}</tbody></table></div></div>`:`<div class="card">${Views.empty('🧾','No sales recorded yet.')}</div>`}
  `;

Views.lineTotal=(it)=>U.round2(Math.max(0,(Number(it.qty)||0)*(Number(it.price)||0)-(Number(it.discount)||0)));

Views.saleForm=(existing)=>{
  const products=DB.all('products').filter(p=>p.active!==false);
  const customers=DB.all('customers');
  if(!products.length){U.toast('Add at least one product first.','warn');location.hash='#/products';return}
  if(!customers.length){U.toast('Add at least one customer first.','warn');location.hash='#/customers';return}
  const editing=!!existing;
  let items=existing?JSON.parse(JSON.stringify(existing.items||[])):[{productId:'',qty:1,price:'',discount:0}];

  const renderItems=(container)=>{
    container.innerHTML=items.map((it,idx)=>`
      <div class="line-item" data-idx="${idx}">
        ${items.length>1?`<button type="button" class="remove" data-rm="${idx}">✕</button>`:''}
        <div class="li-grid">
          <label style="grid-column:1/-1">Product *
            <select data-f="productId" data-idx="${idx}"><option value="">Select product</option>${products.map(p=>`<option value="${p.id}"${it.productId===p.id?' selected':''}>${U.esc(Views.productLabel(p))}${p.size?' · '+U.esc(p.size):''}</option>`).join('')}</select>
          </label>
          <label>Qty *<input type="number" min="0.01" step="0.01" data-f="qty" data-idx="${idx}" value="${it.qty??1}"></label>
          <label>Rate (₹) *<input type="number" min="0" step="0.01" data-f="price" data-idx="${idx}" value="${it.price??''}"></label>
          <label>Discount (₹)<input type="number" min="0" step="0.01" data-f="discount" data-idx="${idx}" value="${it.discount??0}"></label>
          <label>Line Total<input type="text" readonly value="${U.money(Views.lineTotal(it))}"></label>
        </div>
        ${(()=>{const p=DB.find('products',it.productId);const st=p?DB.productStock(p.id):null;return st!==null?`<div class="tiny muted" style="margin-top:.35rem">Available: ${U.num(st,0)} ${U.esc(p.unit||'')}</div>`:''})()}
      </div>`).join('')+
      `<button type="button" class="btn sm outline" data-add-line>+ Add another product</button>`;
  };

  const computeTotals=(form)=>{
    const subtotal=U.round2(U.sum(items,i=>(Number(i.qty)||0)*(Number(i.price)||0)));
    const discount=U.round2(U.sum(items,i=>Number(i.discount)||0));
    const tax=Number(DB.data.settings.taxPercent)||0;
    const taxable=Math.max(0,subtotal-discount);
    const taxAmt=U.round2(taxable*tax/100);
    const total=U.round2(taxable+taxAmt);
    const paid=Math.max(0,Number(form.elements['paid']?.value)||0);
    const pending=U.round2(total-paid);
    const set=(n,v)=>{const el=form.elements[n];if(el)el.value=v};
    set('subtotal',U.money(subtotal));set('taxAmount',U.money(taxAmt));set('total',U.money(total));set('pending',U.money(pending));
  };

  UI.form({
    title:editing?'Edit Sale':'Add Sale',
    wide:true,
    submitLabel:editing?'Update Sale':'Save Sale',
    fields:[
      {name:'number',label:'Sale / Invoice ID',type:'text',required:true,col:2},
      {name:'date',label:'Date',type:'date',required:true,value:U.today()},
      {name:'customerId',label:'Customer',type:'select',required:true,placeholder:'Select customer',options:customers.map(c=>({value:c.id,label:c.name+(c.shop?' — '+c.shop:'')}))},
      {name:'method',label:'Payment Method',type:'select',required:true,value:'Cash',options:['Cash','UPI','Bank Transfer','Credit']},
      {name:'paid',label:'Amount Paid (₹)',type:'number',min:0,step:'0.01',value:0},
      {name:'subtotal',label:'Subtotal',type:'text',readonly:true,value:'₹0.00'},
      {name:'taxAmount',label:'Tax',type:'text',readonly:true,value:'₹0.00'},
      {name:'total',label:'Total Amount',type:'text',readonly:true,value:'₹0.00'},
      {name:'pending',label:'Pending',type:'text',readonly:true,value:'₹0.00'},
      {name:'notes',label:'Notes',type:'textarea',col:2}
    ],
    values:existing?{number:existing.number,date:existing.date,customerId:existing.customerId,method:existing.method,paid:existing.paid,notes:existing.notes}:{number:DB.nextNumber('INV',DB.data.settings.invoicePrefix||'INV'),date:U.today(),method:'Cash',paid:0},
    onRender:(sheet,form)=>{
      const notesLabel=form.elements['notes'].closest('label');
      const wrap=document.createElement('div');wrap.style.gridColumn='1/-1';
      wrap.innerHTML=`<div class="section-title" style="margin-top:.3rem">Products</div><div class="line-items" id="lineItems"></div>`;
      notesLabel.parentElement.insertBefore(wrap,notesLabel);
      const itemsEl=wrap.querySelector('#lineItems');renderItems(itemsEl);
      const sync=()=>{itemsEl.querySelectorAll('[data-f]').forEach(el=>{const i=Number(el.dataset.idx);const f=el.dataset.f;if(f==='productId')items[i].productId=el.value;else items[i][f]=el.value===''?'':Number(el.value)})};
      itemsEl.addEventListener('change',e=>{
        const el=e.target;
        if(el.dataset.f==='productId'){
          const idx=Number(el.dataset.idx);const p=DB.find('products',el.value);
          if(p&&!items[idx].price)items[idx].price=p.sellingPrice||0;
          sync();renderItems(itemsEl);computeTotals(form);return
        }
        sync();renderItems(itemsEl);computeTotals(form);
      });
      itemsEl.addEventListener('input',()=>{sync();computeTotals(form)});
      itemsEl.addEventListener('click',e=>{
        if(e.target.dataset.addLine!==undefined){sync();items.push({productId:'',qty:1,price:'',discount:0});renderItems(itemsEl)}
        const rm=e.target.dataset.rm;if(rm!==undefined){sync();items.splice(Number(rm),1);renderItems(itemsEl);computeTotals(form)}
      });
      form.elements['paid'].addEventListener('input',()=>computeTotals(form));
      computeTotals(form);
    },
    onSubmit:(v)=>{
      const valid=items.filter(i=>i.productId&&Number(i.qty)>0);
      if(!valid.length)return 'Add at least one product with a valid quantity.';
      for(const it of valid){
        if(Number(it.qty)<=0)return 'Quantity must be greater than zero.';
        if(Number(it.price)<0)return 'Selling price cannot be negative.';
        if(Number(it.discount||0)<0)return 'Discount cannot be negative.';
      }

      const subtotal=U.round2(U.sum(valid,i=>(Number(i.qty)||0)*(Number(i.price)||0)));
      const discount=U.round2(U.sum(valid,i=>Number(i.discount)||0));
      const tax=Number(DB.data.settings.taxPercent)||0;
      const taxable=Math.max(0,subtotal-discount);
      const taxAmount=U.round2(taxable*tax/100);
      const total=U.round2(taxable+taxAmount);
      const paid=Math.max(0,Number(v.paid)||0);
      if(paid>total+0.01)return 'Amount paid cannot be more than the total amount.';
      const pending=U.round2(total-paid);

      const stockErrors=[];
      for(const it of valid){
        const p=DB.find('products',it.productId);
        const restore=editing?(existing.items.filter(x=>x.productId===it.productId).reduce((a,x)=>a+Number(x.qty||0),0)):0;
        const available=DB.productStock(it.productId)+restore;
        if(Number(it.qty)>available+0.001)stockErrors.push(`${Views.productLabel(p)}: only ${U.num(available,0)} ${p?.unit||''} in stock`);
      }
      if(stockErrors.length)return 'Not enough stock — '+stockErrors.join('; ');

      const itemsWithCost=valid.map(i=>{const p=DB.find('products',i.productId);return {productId:i.productId,qty:Number(i.qty),price:Number(i.price),discount:Number(i.discount)||0,unitCost:Number(p?.costPrice)||0}});

      const rec={number:v.number,date:v.date,customerId:v.customerId,items:itemsWithCost,subtotal,discount,tax,taxAmount,total,paid,pending,method:v.method,notes:v.notes||''};

      if(editing){
        DB.update('sales',existing.id,rec);
        DB.data.invTxns=DB.data.invTxns.filter(t=>t.refId!==existing.id);
        itemsWithCost.forEach(i=>DB.addInvTxn({date:v.date,productId:i.productId,type:'sale',qty:i.qty,unitCost:i.unitCost,refId:existing.id,reason:'Sale '+v.number}));
        DB.save();U.toast('✓ Sale updated','ok');
      }else{
        const saved=DB.insert('sales',rec);
        itemsWithCost.forEach(i=>DB.addInvTxn({date:v.date,productId:i.productId,type:'sale',qty:i.qty,unitCost:i.unitCost,refId:saved.id,reason:'Sale '+v.number}));
        U.toast('✓ Sale saved successfully','ok');
      }
      return true;
    }
  });
};

Views.deleteSale=async (id)=>{
  const s=DB.find('sales',id);if(!s)return;
  const ok=await U.confirm(`Delete sale ${s.number||''}? Stock and balances will be restored.`);
  if(!ok)return;
  DB.data.invTxns=DB.data.invTxns.filter(t=>t.refId!==id);
  DB.remove('sales',id);DB.save();
  U.toast('Sale deleted','ok');App.refresh();
};

/* ---------- EXPENSES ---------- */
Views.expenseCategories=['Raw Material','Packaging','Transport','Electricity','Labour','Rent','Machinery','Maintenance','Marketing','Delivery','Salary','Other'];
Views.expenses=(state)=>{
  const f=state.expFilter||(state.expFilter={q:'',from:'',to:'',category:''});
  let rows=DB.all('expenses').slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  if(f.q){const q=f.q.toLowerCase();rows=rows.filter(e=>(e.description||'').toLowerCase().includes(q)||e.category.toLowerCase().includes(q))}
  if(f.from)rows=rows.filter(e=>e.date>=f.from);
  if(f.to)rows=rows.filter(e=>e.date<=f.to);
  if(f.category)rows=rows.filter(e=>e.category===f.category);
  const total=U.round2(U.sum(rows,e=>e.amount));
  const today=U.round2(U.sum(DB.all('expenses').filter(e=>e.date===U.today()),e=>e.amount));
  const month=U.round2(U.sum(DB.all('expenses').filter(e=>U.inRange(e.date,U.startOfMonth(),U.endOfMonth())),e=>e.amount));
  const byCat={};rows.forEach(e=>{byCat[e.category]=(byCat[e.category]||0)+(Number(e.amount)||0)});
  const catData=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);

  return `
  <div class="page-head"><div><h1>Expenses</h1><p>${rows.length} entr${rows.length===1?'y':'ies'}</p></div><button class="btn primary" data-add-expense>+ Add Expense</button></div>
  <div class="stat-grid" style="grid-template-columns:repeat(3,1fr)">
    ${Views.statCard('c-exp','Total (filtered)',U.money0(total))}
    ${Views.statCard('c-qty','Today',U.money0(today))}
    ${Views.statCard('c-pend','This Month',U.money0(month))}
  </div>
  ${catData.length?`<div class="card"><div class="card-head"><h3>Expenses by Category</h3></div><div class="chart-box"><canvas id="expCatChart"></canvas></div><div class="legend">${catData.slice(0,6).map(([c,v],i)=>`<span><i style="background:${Chart.PALETTE[i%Chart.PALETTE.length]}"></i>${U.esc(c)} · ${U.money0(v)}</span>`).join('')}</div></div>`:''}
  <div class="card tight">
    <input class="search-input" id="expSearch" placeholder="Search description or category…" value="${U.esc(f.q)}">
    <div class="filters" style="margin-top:.6rem">
      <label>From<input type="date" id="expFrom" value="${f.from}"></label>
      <label>To<input type="date" id="expTo" value="${f.to}"></label>
      <label>Category<select id="expCat"><option value="">All categories</option>${Views.expenseCategories.map(c=>`<option value="${c}"${f.category===c?' selected':''}>${c}</option>`).join('')}</select></label>
      <label>&nbsp;<button class="btn sm" id="expClear">Clear</button></label>
    </div>
    <div class="row" style="margin-top:.3rem"><button class="btn sm" id="expExport">⬇ Export CSV</button></div>
  </div>
  ${rows.length?`<div class="card tight"><div class="table-wrap"><table><thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Method</th><th class="num">Amount</th><th></th></tr></thead><tbody>${rows.map(e=>`<tr><td class="nowrap">${U.date(e.date)}</td><td>${U.esc(e.category)}</td><td>${U.esc(e.description||'—')}</td><td>${U.esc(e.method||'—')}</td><td class="num neg">${U.money0(e.amount)}</td><td class="right nowrap"><button class="btn ghost sm" data-edit-expense="${e.id}">✏️</button><button class="btn ghost sm" data-del-expense="${e.id}">🗑</button></td></tr>`).join('')}</tbody></table></div></div>`:`<div class="card">${Views.empty('💸','No expenses recorded yet.')}</div>`}
  `;
};

Views.afterExpenses=()=>{
  const canvas=document.getElementById('expCatChart');if(!canvas)return;
  const byCat={};DB.all('expenses').forEach(e=>{byCat[e.category]=(byCat[e.category]||0)+(Number(e.amount)||0)});
  const data=Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([c,v],i)=>({label:c,value:v,color:Chart.PALETTE[i%Chart.PALETTE.length]}));
  Chart.doughnut(canvas,data,{height:200,centerLabel:'Expenses'});
};

    ${Views.statCard('c-exp','Total',U.money0(total))}
    ${Views.statCard('c-profit','Paid',U.money0(paid))}
    ${Views.statCard('c-pend','Pending',U.money0(pending))}
  </div>
  <div class="row wrap" style="margin-bottom:1rem">
    <button class="btn sm" data-add-purchase-return>↩ Record Purchase Return</button>

Views.purchaseForm=(existing)=>{
  const suppliers=DB.all('suppliers');
  const mats=DB.all('rawMaterials');
  if(!mats.length){U.toast('Add a raw material first.','warn');location.hash='#/inventory';return}
  if(!suppliers.length){U.toast('Add a supplier first.','warn');location.hash='#/suppliers';return}
  const editing=!!existing;
  let items=existing?JSON.parse(JSON.stringify(existing.items||[])):[{materialId:'',qty:1,price:''}];

  const renderItems=(container)=>{
    container.innerHTML=items.map((it,idx)=>`
      <div class="line-item" data-idx="${idx}">
        ${items.length>1?`<button type="button" class="remove" data-rm="${idx}">✕</button>`:''}
        <div class="li-grid">
          <label style="grid-column:1/-1">Material *<select data-f="materialId" data-idx="${idx}"><option value="">Select material</option>${mats.map(m=>`<option value="${m.id}"${it.materialId===m.id?' selected':''}>${U.esc(m.name)} (${U.esc(m.unit||'')})</option>`).join('')}</select></label>
          <label>Quantity *<input type="number" min="0.0001" step="0.0001" data-f="qty" data-idx="${idx}" value="${it.qty??1}"></label>
          <label>Unit Price (₹) *<input type="number" min="0" step="0.01" data-f="price" data-idx="${idx}" value="${it.price??''}"></label>
          <label style="grid-column:1/-1">Line Total<input type="text" readonly value="${U.money((Number(it.qty)||0)*(Number(it.price)||0))}"></label>
        </div>
      </div>`).join('')+
      `<button type="button" class="btn sm outline" data-add-line>+ Add material</button>`;
  };

  const computeTotals=(form)=>{
    const total=U.round2(U.sum(items,i=>(Number(i.qty)||0)*(Number(i.price)||0)));
    const paid=Math.max(0,Number(form.elements['paid']?.value)||0);
    form.elements['total'].value=U.money(total);
    form.elements['pending'].value=U.money(U.round2(total-paid));
  };

  UI.form({
    title:editing?'Edit Purchase':'Add Purchase',
    wide:true,
    submitLabel:editing?'Update':'Save',
    fields:[
      {name:'number',label:'Purchase ID',type:'text',required:true,col:2},
      {name:'date',label:'Date',type:'date',required:true,value:U.today()},
      {name:'supplierId',label:'Supplier',type:'select',required:true,placeholder:'Select supplier',options:suppliers.map(s=>({value:s.id,label:s.name}))},
      {name:'method',label:'Payment Method',type:'select',required:true,value:'Cash',options:['Cash','UPI','Bank Transfer','Credit']},
      {name:'paid',label:'Amount Paid (₹)',type:'number',min:0,step:'0.01',value:0},
      {name:'total',label:'Total Amount',type:'text',readonly:true,value:'₹0.00'},
      {name:'pending',label:'Pending',type:'text',readonly:true,value:'₹0.00'},
      {name:'notes',label:'Notes',type:'textarea',col:2}
    ],
    values:existing?{number:existing.number,date:existing.date,supplierId:existing.supplierId,method:existing.method,paid:existing.paid,notes:existing.notes}:{number:DB.nextNumber('PUR','PUR'),date:U.today(),method:'Cash',paid:0},
    onRender:(sheet,form)=>{
      const notesLabel=form.elements['notes'].closest('label');
      const wrap=document.createElement('div');wrap.style.gridColumn='1/-1';
      wrap.innerHTML=`<div class="section-title" style="margin-top:.3rem">Materials</div><div class="line-items" id="pLineItems"></div>`;
      notesLabel.parentElement.insertBefore(wrap,notesLabel);
      const itemsEl=wrap.querySelector('#pLineItems');renderItems(itemsEl);
      const sync=()=>{itemsEl.querySelectorAll('[data-f]').forEach(el=>{const i=Number(el.dataset.idx);const f=el.dataset.f;if(f==='materialId')items[i].materialId=el.value;else items[i][f]=el.value===''?'':Number(el.value)})};
      itemsEl.addEventListener('change',e=>{
        if(e.target.dataset.f==='materialId'){
          const idx=Number(e.target.dataset.idx);const m=DB.find('rawMaterials',e.target.value);
          if(m&&!items[idx].price)items[idx].price=m.cost||0;
          sync();renderItems(itemsEl);computeTotals(form);return
        }
        sync();renderItems(itemsEl);computeTotals(form);
      });
      itemsEl.addEventListener('input',()=>{sync();computeTotals(form)});
      itemsEl.addEventListener('click',e=>{if(e.target.dataset.addLine!==undefined){sync();items.push({materialId:'',qty:1,price:''});renderItems(itemsEl)}const rm=e.target.dataset.rm;if(rm!==undefined){sync();items.splice(Number(rm),1);renderItems(itemsEl);computeTotals(form)}});
      form.elements['paid'].addEventListener('input',()=>computeTotals(form));
      computeTotals(form);
    },
    onSubmit:(v)=>{
      const valid=items.filter(i=>i.materialId&&Number(i.qty)>0);
      if(!valid.length)return 'Add at least one material with a valid quantity.';
      const total=U.round2(U.sum(valid,i=>(Number(i.qty)||0)*(Number(i.price)||0)));
      const paid=Math.max(0,Number(v.paid)||0);
      if(paid>total+0.01)return 'Amount paid cannot be more than the total amount.';
      const pending=U.round2(total-paid);
      const rec={number:v.number,date:v.date,supplierId:v.supplierId,items:valid.map(i=>({materialId:i.materialId,qty:Number(i.qty),price:Number(i.price),unit:DB.find('rawMaterials',i.materialId)?.unit||''})),total,paid,pending,method:v.method,notes:v.notes||''};
      if(editing){
        DB.update('purchases',existing.id,rec);
        DB.data.rawTxns=DB.data.rawTxns.filter(t=>t.refId!==existing.id);
        rec.items.forEach(i=>DB.addRawTxn({date:v.date,materialId:i.materialId,type:'purchase',qty:i.qty,unitCost:i.price,refId:existing.id,notes:'Purchase '+v.number}));
        DB.save();U.toast('✓ Purchase updated','ok')
      }else{
        const saved=DB.insert('purchases',rec);
        rec.items.forEach(i=>DB.addRawTxn({date:v.date,materialId:i.materialId,type:'purchase',qty:i.qty,unitCost:i.price,refId:saved.id,notes:'Purchase '+v.number}));
        U.toast('✓ Purchase saved','ok')
      }
      return true;
    }
  });
};

Views.deletePurchase=async (id)=>{
  const p=DB.find('purchases',id);if(!p)return;
  const ok=await U.confirm(`Delete purchase ${p.number||''}? Stock will be reduced back.`);
  if(!ok)return;
  DB.data.rawTxns=DB.data.rawTxns.filter(t=>t.refId!==id);
  DB.remove('purchases',id);DB.save();
  U.toast('Purchase deleted','ok');App.refresh();
};

    ${Views.statCard('c-profit','Total Paid',U.money0(totalPaid))}
    ${Views.statCard('c-pend','Balance Due',U.money0(balance),balance>0?'Pending':'Clear')}

  <div class="card"><div class="card-head"><h3>Purchase History</h3></div>
    ${sales.length?`<div class="table-wrap"><table><thead><tr><th>Date</th><th>Invoice</th><th class="num">Total</th><th class="num">Paid</th><th class="num">Pending</th><th></th></tr></thead><tbody>${sales.map(s=>`<tr><td class="nowrap">${U.date(s.date)}</td><td>${U.esc(s.number||'')}</td><td class="num">${U.money0(s.total)}</td><td class="num">${U.money0(s.paid)}</td><td class="num ${s.pending>0?'neg':''}">${U.money0(s.pending)}</td><td><a href="#/sale/${s.id}" class="tiny">View</a></td></tr>`).join('')}</tbody></table></div>`:Views.empty('🧾','No purchases yet.')}
  </div>

Views.afterCashflow=(state)=>{
  const range=state.cfRange||{from:U.startOfMonth(),to:U.endOfMonth()};
  const days=Views.daysBetween(range.from,range.to);
  const series=days.map(d=>{const c=DB.cashFlow(d,d);return {label:d.slice(8)+'/'+d.slice(5,7),value:c.net}});

  if(days.length>14)Chart.bar(canvas,series,{color:'#0891b2',height:190});else Chart.line(canvas,series,{color:'#0891b2',height:190});

    <div class="kv" style="border-top:1.5px solid var(--line);padding-top:.55rem;margin-top:.2rem"><span><b>Gross Profit</b></span><span class="${pl.grossProfit>=0?'pos':'neg'}"><b>${U.money(pl.grossProfit)}</b></span></div>
    <div class="kv"><span>Operating Expenses</span><span>− ${U.money(pl.operating)}</span></div>
    <div class="kv" style="border-top:2px solid var(--ink);padding-top:.6rem;margin-top:.3rem"><span><b>Net Profit</b></span><span class="${pl.netProfit>=0?'pos':'neg'}" style="font-size:1.08rem"><b>${U.money(pl.netProfit)}</b></span></div>

  <div class="grid-dash">
    <div class="card">
      <div class="card-head"><h3>Best Sellers</h3></div>

Views.afterReports=(state)=>{
  const r=state.reportRange||{from:U.startOfMonth(),to:U.endOfMonth()};
  const days=Views.daysBetween(r.from,r.to);
  const salesSeries=days.map(d=>({label:d.slice(8)+'/'+d.slice(5,7),value:U.sum(DB.all('sales').filter(s=>s.date===d),s=>s.total)}));
  const expSeries=days.map(d=>({label:d.slice(8)+'/'+d.slice(5,7),value:U.sum(DB.all('expenses').filter(e=>e.date===d),e=>e.amount)}));
  const c1=document.getElementById('repSalesChart');const c2=document.getElementById('repExpChart');
  if(c1)(days.length>14?Chart.bar(c1,salesSeries,{color:'#0f9d58',height:160}):Chart.line(c1,salesSeries,{color:'#0f9d58',height:160}));
  if(c2)(days.length>14?Chart.bar(c2,expSeries,{color:'#d97706',height:160}):Chart.line(c2,expSeries,{color:'#d97706',height:160}));

  const top=DB.topSellers(r.from,r.to,6);
  const pc=document.getElementById('topProductsChart');
  if(pc&&top.length)Chart.bar(pc,top.map(x=>({label:x.name,value:x.qty})),{color:'#12787f',height:200,showValues:true});

  const worst=DB.worstSellers(r.from,r.to,6);
  const wc=document.getElementById('worstProductsChart');
  if(wc&&worst.length)Chart.bar(wc,worst.map(x=>({label:x.name,value:x.qty})),{color:'#dc2626',height:200,showValues:true});

  const topC=DB.topCustomers(r.from,r.to,6);
  const cc=document.getElementById('topCustomersChart');
  if(cc&&topC.length)Chart.bar(cc,topC.map(x=>({label:x.name,value:x.value})),{color:'#2563eb',height:200,showValues:true});

  const expCat={};DB.all('expenses').filter(e=>U.inRange(e.date,r.from,r.to)).forEach(e=>{expCat[e.category]=(expCat[e.category]||0)+(Number(e.amount)||0)});
  const ec=document.getElementById('expMixChart');
  if(ec){const data=Object.entries(expCat).sort((a,b)=>b[1]-a[1]).map(([c,v],i)=>({label:c,value:v,color:Chart.PALETTE[i%Chart.PALETTE.length]}));Chart.doughnut(ec,data,{height:200,centerLabel:'Expenses'})}
};

Views.runReport=(kind,state)=>{
  const r=state.reportRange||{from:U.startOfMonth(),to:U.endOfMonth()};
  const rows=[];let headers=[],title='';

  if(kind==='sales'){title='Sales Report';headers=['Date','Invoice','Customer','Items','Total','Paid','Pending','Status'];
    DB.all('sales').filter(s=>U.inRange(s.date,r.from,r.to)).forEach(s=>rows.push([U.date(s.date),s.number||'',Views.customerName(s.customerId),(s.items||[]).map(i=>`${Views.productName(i.productId)} x${i.qty}`).join('; '),s.total,s.paid,s.pending,Views.saleStatus(s)]));
  }else if(kind==='expenses'){title='Expense Report';headers=['Date','Category','Description','Method','Amount'];
    DB.all('expenses').filter(e=>U.inRange(e.date,r.from,r.to)).forEach(e=>rows.push([U.date(e.date),e.category,e.description||'',e.method||'',e.amount]));
  }else if(kind==='purchases'){title='Purchase Report';headers=['Date','ID','Supplier','Items','Total','Paid','Pending'];
    DB.all('purchases').filter(p=>U.inRange(p.date,r.from,r.to)).forEach(p=>rows.push([U.date(p.date),p.number||'',Views.supplierName(p.supplierId),(p.items||[]).map(i=>`${Views.materialName(i.materialId)} x${i.qty}`).join('; '),p.total,p.paid,p.pending]));
  }else if(kind==='inventory'){title='Inventory Report';headers=['Product','SKU','Opening','In','Sold','Damaged','Current','Min','Cost','Value'];
    DB.all('products').forEach(p=>{const b=DB.productStockBreakdown(p.id);rows.push([Views.productLabel(p),p.sku||'',b.opening,b.purchased+b.produced+b.returned,b.sold,b.damaged,b.current,p.minStock||0,p.costPrice||0,U.round2(b.current*(Number(p.costPrice)||0))])});
  }else if(kind==='production'){title='Production Report';headers=['Batch','Date','Product','Qty','Wastage','Material','Labour','Other','Total','Cost/Unit','Mfg','Expiry'];
    DB.all('production').filter(p=>U.inRange(p.date,r.from,r.to)).forEach(b=>rows.push([b.number||'',U.date(b.date),Views.productName(b.productId),b.qty,b.wastageQty||0,b.materialCost,b.labourCost,b.otherCost,b.totalCost,b.costPerUnit,U.date(b.mfgDate),b.expiryDate?U.date(b.expiryDate):'']));
  }else if(kind==='cust-out'){title='Customer Outstanding';headers=['Customer','Phone','City','Balance Due'];
    DB.all('customers').forEach(c=>{const bal=DB.customerBalance(c.id);if(bal>0.01)rows.push([c.name,c.phone||'',c.city||'',bal])});
  }else if(kind==='supp-out'){title='Supplier Outstanding';headers=['Supplier','Phone','Company','Balance Payable'];
    DB.all('suppliers').forEach(s=>{const bal=DB.supplierBalance(s.id);if(bal>0.01)rows.push([s.name,s.phone||'',s.company||'',bal])});
  }else if(kind==='pl'){const pl=DB.profitAndLoss(r.from,r.to);title='Profit & Loss';headers=['Item','Amount'];
    rows.push(['Gross Revenue',pl.grossRevenue]);rows.push(['Sales Returns',-pl.returnsTotal]);rows.push(['Net Revenue',pl.revenue]);rows.push(['COGS',-pl.cogs]);rows.push(['Gross Profit',pl.grossProfit]);rows.push(['Operating Expenses',-pl.operating]);rows.push(['Net Profit',pl.netProfit]);
  }else if(kind==='deliveries'){title='Delivery Report';headers=['Date','Customer','Person','Vehicle','Address','To Collect','Collected','Status'];
    DB.all('deliveries').filter(d=>U.inRange(d.date,r.from,r.to)).forEach(d=>rows.push([U.date(d.date),Views.customerName(d.customerId),d.person||'',d.vehicle||'',d.address||'',d.amountToCollect||0,d.amountCollected||0,d.status]));
  }else if(kind==='cashflow'){title='Cash Flow Report';headers=['Period','Cash In','Cash Out','Net'];
    const cf=DB.cashFlow(r.from,r.to);rows.push([`${U.date(r.from)} – ${U.date(r.to)}`,cf.cashIn,cf.cashOut,cf.net]);
  }else if(kind==='returns'){title='Returns Report';headers=['Type','Date','Party','Items','Amount'];
    DB.all('salesReturns').filter(x=>U.inRange(x.date,r.from,r.to)).forEach(x=>rows.push(['Sales',U.date(x.date),Views.customerName(x.customerId),(x.items||[]).map(i=>`${Views.productName(i.productId)} x${i.qty}`).join('; '),-x.total]));
    DB.all('purchaseReturns').filter(x=>U.inRange(x.date,r.from,r.to)).forEach(x=>rows.push(['Purchase',U.date(x.date),Views.supplierName(x.supplierId),(x.items||[]).map(i=>`${Views.materialName(i.materialId)} x${i.qty}`).join('; '),-x.total]));
  }

  UI.info(title,`
    <p class="muted small">${U.date(r.from)} – ${U.date(r.to)} · ${rows.length} row${rows.length===1?'':'s'}</p>
    <div class="table-wrap" style="max-height:50vh;overflow-y:auto;margin-top:.6rem">
      <table><thead><tr>${headers.map(h=>`<th>${U.esc(h)}</th>`).join('')}</tr></thead><tbody>
        ${rows.length?rows.map(row=>`<tr>${row.map(cell=>`<td class="${typeof cell==='number'?'num':''}">${typeof cell==='number'?U.money0(cell):U.esc(cell)}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${headers.length}" class="center muted" style="padding:1.5rem">No data in this period</td></tr>`}
      </tbody></table>
    </div>
    <div class="sheet-actions">
      <button class="btn" data-close>Close</button>
      <button class="btn primary" id="repExport">⬇ Export CSV</button>
      <button class="btn" id="repPrint">🖨 Print</button>
    </div>`);
  setTimeout(()=>{
    const exp=document.getElementById('repExport');const pr=document.getElementById('repPrint');
    if(exp)exp.onclick=()=>U.downloadCSV(`${kind}-${r.from}-to-${r.to}.csv`,headers,rows);
    if(pr)pr.onclick=()=>{
      document.body.classList.add('printing');
      const cleanup=()=>document.body.classList.remove('printing');
      window.addEventListener('afterprint',cleanup,{once:true});
      setTimeout(()=>{window.print();setTimeout(cleanup,1200)},40);
    };
  },30);
};

  else if(kind==='expenses'){U.downloadCSV('expenses.csv',['Date','Category','Description','Amount','Method','Notes'],DB.all('expenses').map(e=>[U.date(e.date),e.category,e.description||'',e.amount,e.method||'',e.notes||'']))}
  else if(kind==='purchases'){U.downloadCSV('purchases.csv',['Date','ID','Supplier','Items','Total','Paid','Pending'],DB.all('purchases').map(p=>[U.date(p.date),p.number||'',Views.supplierName(p.supplierId),(p.items||[]).map(i=>`${Views.materialName(i.materialId)} x${i.qty}`).join('; '),p.total,p.paid,p.pending]))}
  else if(kind==='production'){U.downloadCSV('production.csv',['Batch','Date','Product','Qty','Wastage','Total Cost','Cost/Unit'],DB.all('production').map(b=>[b.number||'',U.date(b.date),Views.productName(b.productId),b.qty,b.wastageQty||0,b.totalCost,b.costPerUnit]))}
  else if(kind==='inventory'){U.downloadCSV('inventory.csv',['Product','SKU','Opening','In','Sold','Damaged','Current','Min','Cost','Value'],DB.all('products').map(p=>{const b=DB.productStockBreakdown(p.id);return [Views.productLabel(p),p.sku||'',b.opening,b.purchased+b.produced+b.returned,b.sold,b.damaged,b.current,p.minStock||0,p.costPrice||0,U.round2(b.current*(Number(p.costPrice)||0))]}))}
  else if(kind==='customers'){U.downloadCSV('customers.csv',['Name','Shop','Phone','City','GST','Balance'],DB.all('customers').map(c=>[c.name,c.shop||'',c.phone||'',c.city||'',c.gst||'',DB.customerBalance(c.id)]))}

  U.toast('✓ CSV exported','ok');
};

const App={
  state:{},currentView:null,fbUser:null,offlineMode:false,

  session(){try{return JSON.parse(localStorage.getItem('dms_session')||'null')}catch{return null}},
  setSession(s,remember){
    if(s){localStorage.setItem('dms_session',JSON.stringify(s));if(remember)localStorage.setItem('dms_remember',s.login);else localStorage.removeItem('dms_remember')}
    else localStorage.removeItem('dms_session');
  },

  /* email for firebase: phone → synthetic email */
  toEmail(id){
    const v=String(id||'').trim();
    if(v.includes('@')) return v.toLowerCase();
    const d=U.digits(v);
    return d ? d+'@detergent.local' : v;
  },

  async boot(){
    DB.load();
    this.bindLogin();
    this.bindGlobal();
    this.updateCloudBadge();

    if(!fbReady){
      U.toast('Firebase unavailable — running offline','warn');
      this.showLogin();
      return;
    }

    // Show login immediately, then react to auth state
    this.showLogin();

    onAuthStateChanged(fbAuth, async user=>{
      if(user){
        this.fbUser=user;
        this.offlineMode=false;
        this.setSession({userId:user.uid,login:user.email||''},!!localStorage.getItem('dms_remember'));
        await Cloud.attach(user.uid);
        this.showApp();
      }else{
        this.fbUser=null;
        Cloud.detach();
        this.updateCloudBadge();
        // Keep offline-mode session alive if the user chose it
        if(!this.offlineMode && !this.session()?.offline){
          this.showLogin();
        }
      }
    });
  },

  showLogin(){
    document.getElementById('login').classList.remove('hidden');
    document.getElementById('app').classList.add('hidden');
    document.getElementById('loginBizName').textContent=DB.data.settings.businessName||'MY DETERGENT BUSINESS';
    const rem=localStorage.getItem('dms_remember');if(rem)document.getElementById('loginId').value=rem;
  },

  showApp(){
    document.getElementById('login').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('topBizName').textContent=DB.data.settings.businessName||'MY DETERGENT BUSINESS';
    this.renderSidebar();
    this.updateCloudBadge();
    if(!location.hash||location.hash==='#')location.hash='#/dashboard';
    this.route();
  },

  refresh(){ this.renderSidebar(); this.route(); },

  updateCloudBadge(){
    const el=document.getElementById('cloudBadge');if(!el)return;
    if(!Cloud.enabled){
      el.className='cloud-badge off';
      el.textContent = this.offlineMode ? '● Offline mode' : '● Offline';
      return;
    }
    if(Cloud.status==='ok'){el.className='cloud-badge ok';el.textContent='☁ Synced'}
    else if(Cloud.status==='syncing'){el.className='cloud-badge sync';el.textContent='↻ Syncing'}
    else if(Cloud.status==='connecting'){el.className='cloud-badge sync';el.textContent='↻ Connecting'}
    else if(Cloud.status==='error'){el.className='cloud-badge err';el.textContent='⚠ Sync error'}
    else {el.className='cloud-badge off';el.textContent='● Offline'}
  },

  bindLogin(){
    let mode='signin';
    const form=document.getElementById('loginForm');
    const errEl=document.getElementById('loginErr');
    const submit=document.getElementById('loginSubmit');
    const pass2Wrap=document.getElementById('confirmWrap');

    const setMode=(m)=>{
      mode=m;
      if(m==='signup'){
        submit.textContent='Create account';
        pass2Wrap.classList.remove('hidden');
        document.getElementById('signupBtn').textContent='← Back to sign in';
        document.getElementById('loginSub').textContent='Create your business account';
      }else{
        submit.textContent='Sign in';
        pass2Wrap.classList.add('hidden');
        document.getElementById('signupBtn').textContent='Create account';
        document.getElementById('loginSub').textContent='Business Management System';
      }
      errEl.textContent='';
    };

    document.getElementById('signupBtn').addEventListener('click',()=>setMode(mode==='signup'?'signin':'signup'));

    form.addEventListener('submit',async e=>{
      e.preventDefault();
      errEl.textContent='';
      const id=document.getElementById('loginId').value.trim();
      const pass=document.getElementById('loginPass').value;
      const pass2=document.getElementById('loginPass2').value;
      const remember=document.getElementById('remember').checked;

      if(!id||!pass){errEl.textContent='Please enter both email/phone and password.';return}
      if(pass.length<6){errEl.textContent='Password must be at least 6 characters.';return}
      if(mode==='signup'&&pass!==pass2){errEl.textContent='Passwords do not match.';return}
      if(!fbReady){errEl.textContent='Firebase is not available. Use "Continue offline" instead.';return}

      const email=this.toEmail(id);
      submit.disabled=true;const orig=submit.textContent;submit.textContent=mode==='signup'?'Creating…':'Signing in…';

      try{
        if(mode==='signup'){
          await createUserWithEmailAndPassword(fbAuth,email,pass);
          U.toast('✓ Account created','ok');
        }else{
          await signInWithEmailAndPassword(fbAuth,email,pass);
          U.toast('✓ Signed in','ok');
        }
        if(remember)localStorage.setItem('dms_remember',id);
        document.getElementById('loginPass').value='';
        document.getElementById('loginPass2').value='';
        // onAuthStateChanged handles the rest
      }catch(err){
        console.warn(err);
        errEl.textContent=authMsg(err);
      }finally{
        submit.disabled=false;submit.textContent=orig;
      }
    });

    document.getElementById('forgotBtn').addEventListener('click',async ()=>{
      const id=document.getElementById('loginId').value.trim();
      if(!id||!id.includes('@')){
        UI.info('Reset Password',`<p class="muted small">Enter your <b>email address</b> in the field above, then tap "Forgot password?" again. Phone-based accounts must use "Continue offline" or sign up with an email.</p>`);
        return;
      }
      if(!fbReady){U.toast('Firebase unavailable','err');return}
      try{
        await sendPasswordResetEmail(fbAuth,id);
        UI.info('Reset Email Sent',`<p class="muted small">We've sent a password reset link to <b>${U.esc(id)}</b>. Check your inbox (and spam folder).</p>`);
      }catch(err){U.toast(authMsg(err),'err')}
    });

    document.getElementById('offlineBtn').addEventListener('click',()=>{
      this.offlineMode=true;
      Cloud.detach();
      this.setSession({userId:'offline',login:'Offline mode',offline:true},false);
      this.updateCloudBadge();
      U.toast('Running offline — data stays on this device','warn');
      this.showApp();
    });
  },

    this.currentView=view;
    const el=document.getElementById('view');
    let html='';let after=null;
    try{
      switch(view){
        case 'dashboard':html=Views.dashboard(this.state);after=()=>Views.afterDashboard(this.state);break;
        case 'sales':html=Views.sales(this.state);break;
        case 'sale':html=Views.saleDetail(param);break;
        case 'expenses':html=Views.expenses(this.state);after=()=>Views.afterExpenses();break;
        case 'purchases':html=Views.purchases();break;
        case 'products':html=Views.products(this.state);break;
        case 'product':html=Views.productDetail(param);break;
        case 'recipes':html=Views.recipes(this.state);break;
        case 'recipe':html=Views.recipeDetail(param);break;
        case 'inventory':html=Views.inventory();break;
        case 'production':html=Views.production();break;
        case 'deliveries':html=Views.deliveries(this.state);break;
        case 'delivery':html=Views.deliveryDetail(param);break;
        case 'salesReturns':html=Views.salesReturns(this.state);break;
        case 'purchaseReturns':html=Views.purchaseReturns();break;
        case 'customers':html=Views.customers(this.state);break;
        case 'customer':html=Views.customerDetail(param);break;
        case 'suppliers':html=Views.suppliers(this.state);break;
        case 'supplier':html=Views.supplierDetail(param);break;
        case 'payments':html=Views.payments();break;
        case 'cashflow':html=Views.cashflow(this.state);after=()=>Views.afterCashflow(this.state);break;
        case 'reports':html=Views.reports(this.state);after=()=>Views.afterReports(this.state);break;
        case 'settings':html=Views.settings();break;
        case 'more':html=Views.more();break;
        default:html=`<div class="card">${Views.empty('🔍','Page not found.')}</div>`;
      }
    }catch(err){console.error('Render error',err);html=`<div class="card"><div class="alert danger"><span class="ico">⚠️</span><div><strong>Unable to load this page</strong>${U.esc(err.message||'Unknown error')}</div></div></div>`}
    el.innerHTML=html;
    this.highlightNav(view);
    if(after){
      try{requestAnimationFrame(()=>{try{after()}catch(e){console.error('After-render',e)}})}
      catch(err){console.error('After-render',err)}
    }
    this.bindView();
    window.scrollTo({top:0,behavior:'instant'});

  openSearch(){

    const ov=document.createElement('div');

    ov.innerHTML=`
      <div class="search-panel">
        <div class="search-head">
          <span style="font-size:1.1rem">🔍</span>
          <input type="search" id="gsInput" placeholder="Search products, customers, invoices, recipes, deliveries…" autocomplete="off">
          <button class="icon-btn" id="gsClose">✕</button>
        </div>
        <div class="search-body" id="gsBody"></div>
      </div>`;

    const body=document.getElementById('gsBody');

    document.getElementById('gsClose').addEventListener('click',close);
    ov.addEventListener('click',e=>{if(e.target===ov)close()});
    document.addEventListener('keydown',function esc(e){if(e.key==='Escape'){close();document.removeEventListener('keydown',esc)}});

    const render=(q)=>{
      q=(q||'').trim().toLowerCase();
      if(q.length<1){
        body.innerHTML=`<div class="muted small center" style="padding:1.6rem .5rem">Start typing to search across your business.<br><span class="tiny">Tip: press Ctrl/⌘ + K anytime</span></div>`;
        return;
      }
      const groups={};
      const add=(g,item)=>{ (groups[g]=groups[g]||[]).push(item) };

      DB.all('products').forEach(p=>{
        if((p.name||'').toLowerCase().includes(q)||(p.sku||'').toLowerCase().includes(q)||(p.category||'').toLowerCase().includes(q))
          add('Products',{label:Views.productLabel(p),sub:`${p.sku||''} · Stock ${U.num(DB.productStock(p.id),0)} ${p.unit||''}`,href:'#/product/'+p.id});
      });
      DB.all('customers').forEach(c=>{
        if((c.name||'').toLowerCase().includes(q)||(c.phone||'').includes(q)||(c.shop||'').toLowerCase().includes(q)||(c.city||'').toLowerCase().includes(q))
          add('Customers',{label:c.name,sub:`${c.phone||''} · Due ${U.money0(DB.customerBalance(c.id))}`,href:'#/customer/'+c.id});
      });
      DB.all('sales').forEach(s=>{
        const cust=Views.customerName(s.customerId);
        const itemMatch=(s.items||[]).some(i=>Views.productName(i.productId).toLowerCase().includes(q));
        if((s.number||'').toLowerCase().includes(q)||cust.toLowerCase().includes(q)||itemMatch)
          add('Invoices',{label:s.number||'Sale',sub:`${U.date(s.date)} · ${cust} · ${U.money0(s.total)} · ${Views.saleStatus(s)}`,href:'#/sale/'+s.id});
      });
      DB.all('suppliers').forEach(s=>{
        if((s.name||'').toLowerCase().includes(q)||(s.company||'').toLowerCase().includes(q)||(s.phone||'').includes(q))
          add('Suppliers',{label:s.name,sub:`${s.company||''} ${s.phone||''} · Payable ${U.money0(DB.supplierBalance(s.id))}`,href:'#/supplier/'+s.id});
      });
      DB.all('recipes').forEach(r=>{
        if((r.name||'').toLowerCase().includes(q))
          add('Recipes',{label:r.name,sub:`${(r.items||[]).length} ingredients · ${U.money0(DB.recipeCost(r.id))}`,href:'#/recipe/'+r.id});
      });
      DB.all('rawMaterials').forEach(m=>{
        if((m.name||'').toLowerCase().includes(q))
          add('Raw Materials',{label:m.name,sub:`Stock ${U.num(DB.rawStock(m.id),2)} ${m.unit||''} · ${U.money(m.cost||0)}`,href:'#/inventory'});
      });
      DB.all('deliveries').forEach(d=>{
        const cust=Views.customerName(d.customerId);
        if(cust.toLowerCase().includes(q)||(d.person||'').toLowerCase().includes(q)||(d.vehicle||'').toLowerCase().includes(q)||(d.status||'').toLowerCase().includes(q))
          add('Deliveries',{label:`${cust} · ${d.status}`,sub:`${U.date(d.date)} · ${d.person||''} ${d.vehicle||''}`,href:'#/delivery/'+d.id});
      });
      DB.all('purchases').forEach(p=>{
        if((p.number||'').toLowerCase().includes(q)||Views.supplierName(p.supplierId).toLowerCase().includes(q))
          add('Purchases',{label:p.number||'Purchase',sub:`${U.date(p.date)} · ${Views.supplierName(p.supplierId)} · ${U.money0(p.total)}`,href:'#/purchases'});
      });
      DB.all('expenses').forEach(e=>{
        if((e.description||'').toLowerCase().includes(q)||(e.category||'').toLowerCase().includes(q))
          add('Expenses',{label:e.description||e.category,sub:`${U.date(e.date)} · ${e.category} · ${U.money0(e.amount)}`,href:'#/expenses'});
      });
      DB.all('production').forEach(b=>{
        if((b.number||'').toLowerCase().includes(q)||Views.productName(b.productId).toLowerCase().includes(q))
          add('Production',{label:b.number||'Batch',sub:`${U.date(b.date)} · ${Views.productName(b.productId)} · ${U.num(b.qty,0)} units`,href:'#/production'});
      });

      const keys=Object.keys(groups);
      const total=keys.reduce((a,k)=>a+groups[k].length,0);
      if(!total){body.innerHTML=`<div class="empty"><span class="ic">🔍</span><p>No results for “${U.esc(q)}”</p></div>`;return}

      body.innerHTML=keys.map(k=>`
        <div class="sr-group">${U.esc(k)} · ${groups[k].length}</div>
        ${groups[k].slice(0,8).map(it=>`<div class="sr-item" data-href="${U.esc(it.href)}"><div style="min-width:0"><div class="t">${U.esc(it.label)}</div><div class="s">${U.esc(it.sub)}</div></div><span class="muted">›</span></div>`).join('')}
      `).join('');
    };

    body.addEventListener('click',e=>{
      const it=e.target.closest('[data-href]');if(!it)return;
      location.hash=it.dataset.href;
      close();
    });

    input.addEventListener('input',U.debounce(()=>render(input.value),160));
    render('');
    setTimeout(()=>input.focus(),50);
  },

  /* ---------------- VIEW EVENT BINDING ---------------- */
  bindView(){
    const view=document.getElementById('view');

    view.onclick=(e)=>{
      /* 1. id-based buttons */
      const btn=e.target.closest('button, a');
      if(btn && btn.id && this.handleIdClick(btn, e)) return;

      /* 2. nearest ancestor carrying data-* */
      let node=e.target, target=null;
      while(node && node!==view.parentElement){
        if(node.dataset && Object.keys(node.dataset).length){target=node;break}
        node=node.parentElement;
      }
      if(!target) return;
      const d=target.dataset;

      /* range pickers */
      if(d.range){
        const r={key:d.range};const today=U.today();
        if(d.range==='today'){r.from=today;r.to=today}
        else if(d.range==='week'){r.from=U.startOfWeek();r.to=today}
        else if(d.range==='month'){r.from=U.startOfMonth();r.to=U.endOfMonth()}
        else if(d.range==='year'){r.from=U.startOfYear();r.to=today}
        else {r.from=this.state.range?.from||U.startOfMonth();r.to=this.state.range?.to||today}
        this.state.range=r;this.route();return
      }
      if(d.reportRange){
        const r={key:d.reportRange};const today=U.today();
        if(d.reportRange==='today'){r.from=today;r.to=today}
        else if(d.reportRange==='week'){r.from=U.startOfWeek();r.to=today}
        else if(d.reportRange==='month'){r.from=U.startOfMonth();r.to=U.endOfMonth()}
        else if(d.reportRange==='year'){r.from=U.startOfYear();r.to=today}
        else {r.from=this.state.reportRange?.from||U.startOfMonth();r.to=this.state.reportRange?.to||today}
        this.state.reportRange=r;this.route();return
      }
      if(d.cfRange){
        const r={key:d.cfRange};const today=U.today();
        if(d.cfRange==='today'){r.from=today;r.to=today}
        else if(d.cfRange==='week'){r.from=U.startOfWeek();r.to=today}
        else if(d.cfRange==='month'){r.from=U.startOfMonth();r.to=U.endOfMonth()}
        else if(d.cfRange==='year'){r.from=U.startOfYear();r.to=today}
        else {r.from=this.state.cfRange?.from||U.startOfMonth();r.to=this.state.cfRange?.to||today}
        this.state.cfRange=r;this.route();return
      }

      /* inventory tabs */
      if(d.tab==='finished'||d.tab==='raw'){
        document.querySelectorAll('#invTabs .chip').forEach(c=>c.classList.toggle('active',c===target));
        document.getElementById('invFinished').classList.toggle('hidden',d.tab!=='finished');
        document.getElementById('invRaw').classList.toggle('hidden',d.tab!=='raw');
        return;
      }

      /* create actions */
      if(d.addSale!==undefined){this.addSale();return}
      if(d.addSaleFor){location.hash='#/sales';setTimeout(()=>Views.saleForm(),80);return}
      if(d.addExpense!==undefined){Views.expenseForm();return}
      if(d.addPurchase!==undefined){Views.purchaseForm();return}
      if(d.addProduct!==undefined){Views.productForm();return}
      if(d.addCustomer!==undefined){Views.customerForm();return}
      if(d.addSupplier!==undefined){Views.supplierForm();return}
      if(d.addMaterial!==undefined){Views.materialForm();return}
      if(d.addProduction!==undefined){Views.productionForm();return}
      if(d.addRecipe!==undefined){Views.recipeForm();return}
      if(d.addDelivery!==undefined){Views.deliveryForm(d.addDelivery||null);return}
      if(d.addReturn!==undefined){Views.salesReturnForm();return}
      if(d.addReturnSale){Views.salesReturnForm(d.addReturnSale);return}
      if(d.addPurchaseReturn!==undefined){Views.purchaseReturnForm();return}
      if(d.rawAction!==undefined){Views.rawStockAction();return}
      if(d.produceRecipe){location.hash='#/production';setTimeout(()=>Views.productionForm(),80);return}

      /* edit actions */
      if(d.editSale){const s=DB.find('sales',d.editSale);if(s)Views.saleForm(s);return}
      if(d.editExpense){const x=DB.find('expenses',d.editExpense);if(x)Views.expenseForm(x);return}
      if(d.editPurchase){const p=DB.find('purchases',d.editPurchase);if(p)Views.purchaseForm(p);return}
      if(d.editProduct){const p=DB.find('products',d.editProduct);if(p)Views.productForm(p);return}
      if(d.editCustomer){const c=DB.find('customers',d.editCustomer);if(c)Views.customerForm(c);return}
      if(d.editSupplier){const s=DB.find('suppliers',d.editSupplier);if(s)Views.supplierForm(s);return}
      if(d.editMaterial){const m=DB.find('rawMaterials',d.editMaterial);if(m)Views.materialForm(m);return}
      if(d.editProduction){const p=DB.find('production',d.editProduction);if(p)Views.productionForm(p);return}
      if(d.editRecipe){const r=DB.find('recipes',d.editRecipe);if(r)Views.recipeForm(r);return}
      if(d.editDelivery){const x=DB.find('deliveries',d.editDelivery);if(x)Views.deliveryForm(null,x);return}

      /* delete actions */
      if(d.delSale){Views.deleteSale(d.delSale);return}
      if(d.delExpense){(async()=>{const ok=await U.confirm('Delete this expense?');if(!ok)return;DB.remove('expenses',d.delExpense);U.toast('Deleted','ok');this.route()})();return}
      if(d.delPurchase){Views.deletePurchase(d.delPurchase);return}
      if(d.delProduct){(async()=>{const ok=await U.confirm('Delete this product? Stock history will also be removed.');if(!ok)return;DB.data.invTxns=DB.data.invTxns.filter(t=>t.productId!==d.delProduct);DB.remove('products',d.delProduct);DB.save();U.toast('Deleted','ok');location.hash='#/products';this.route()})();return}
      if(d.delCustomer){(async()=>{const ok=await U.confirm('Delete this customer?');if(!ok)return;DB.remove('customers',d.delCustomer);U.toast('Deleted','ok');location.hash='#/customers';this.route()})();return}
      if(d.delSupplier){(async()=>{const ok=await U.confirm('Delete this supplier?');if(!ok)return;DB.remove('suppliers',d.delSupplier);U.toast('Deleted','ok');location.hash='#/suppliers';this.route()})();return}
      if(d.delMaterial){(async()=>{const ok=await U.confirm('Delete this raw material?');if(!ok)return;DB.data.rawTxns=DB.data.rawTxns.filter(t=>t.materialId!==d.delMaterial);DB.remove('rawMaterials',d.delMaterial);DB.save();U.toast('Deleted','ok');this.route()})();return}
      if(d.delProduction){Views.deleteProduction(d.delProduction);return}
      if(d.delRecipe){(async()=>{const ok=await U.confirm('Delete this recipe?');if(!ok)return;DB.remove('recipes',d.delRecipe);U.toast('Deleted','ok');location.hash='#/recipes';this.route()})();return}
      if(d.delDelivery){(async()=>{const ok=await U.confirm('Delete this delivery?');if(!ok)return;DB.remove('deliveries',d.delDelivery);U.toast('Deleted','ok');location.hash='#/deliveries';this.route()})();return}
      if(d.delReturnSale){(async()=>{const ok=await U.confirm('Delete this return? Stock will be adjusted back.');if(!ok)return;DB.data.invTxns=DB.data.invTxns.filter(t=>t.refId!==d.delReturnSale);DB.remove('salesReturns',d.delReturnSale);DB.save();U.toast('Deleted','ok');this.route()})();return}
      if(d.delPurchaseReturn){(async()=>{const ok=await U.confirm('Delete this return? Raw stock will be adjusted back.');if(!ok)return;DB.data.rawTxns=DB.data.rawTxns.filter(t=>t.refId!==d.delPurchaseReturn);DB.remove('purchaseReturns',d.delPurchaseReturn);DB.save();U.toast('Deleted','ok');this.route()})();return}

      /* misc actions */
      if(d.stockAction){Views.stockAction(d.stockAction);return}
      if(d.recordPayment){Views.customerPaymentForm(d.recordPayment);return}
      if(d.recordSuppPayment){Views.supplierPaymentForm(d.recordSuppPayment);return}
      if(d.delCustpay){(async()=>{const ok=await U.confirm('Delete this payment?');if(!ok)return;DB.remove('custPayments',d.delCustpay);U.toast('Deleted','ok');this.route()})();return}
      if(d.delSupppay){(async()=>{const ok=await U.confirm('Delete this payment?');if(!ok)return;DB.remove('suppPayments',d.delSupppay);U.toast('Deleted','ok');this.route()})();return}

      /* navigation */
      if(d.openProduct){location.hash='#/product/'+d.openProduct;return}
      if(d.openCustomer){location.hash='#/customer/'+d.openCustomer;return}
      if(d.openSupplier){location.hash='#/supplier/'+d.openSupplier;return}
      if(d.openRecipe){location.hash='#/recipe/'+d.openRecipe;return}
      if(d.openDelivery){location.hash='#/delivery/'+d.openDelivery;return}
      if(d.viewSale){location.hash='#/sale/'+d.viewSale;return}
      if(d.openSale){location.hash='#/sale/'+d.openSale;return}

      if(d.report){Views.runReport(d.report,this.state);return}
      if(d.exportAll){Views.exportAll(d.exportAll);return}
    };

    /* ---------- id-based handlers ---------- */
    this._idHandlers=(btn)=>{
      const id=btn.id;
      if(id==='printInvoice'){document.body.classList.remove('printing');window.print();return true}
      if(id==='shareInvoice'){
        const box=document.getElementById('invoiceBox');if(!box)return true;
        const text=box.innerText.slice(0,1800);
        if(navigator.share){navigator.share({title:'Invoice',text}).catch(()=>{})}
        else if(navigator.clipboard){navigator.clipboard.writeText(text).then(()=>U.toast('Invoice copied to clipboard','ok')).catch(()=>U.toast('Copy failed','err'))}
        else U.toast('Sharing not supported','warn');
        return true;
      }
      if(id==='waInvoice'){
        const s=DB.find('sales',(location.hash.split('/')[2]||''));
        if(!s)return true;
        const c=DB.find('customers',s.customerId)||{};
        const st=DB.settings();
        const phone=U.digits(c.phone||'');
        const lines=[
          `*${st.businessName||''}*`,
          `Invoice: ${s.number||''}`,
          `Date: ${U.date(s.date)}`,
          ``,
          ...(s.items||[]).map(i=>`• ${Views.productName(i.productId)} × ${U.num(i.qty,2)} = ${U.money(Views.lineTotal(i))}`),
          ``,
          `Subtotal: ${U.money(s.subtotal)}`,
          Number(s.discount)?`Discount: − ${U.money(s.discount)}`:'',
          Number(s.taxAmount)?`Tax: + ${U.money(s.taxAmount)}`:'',
          `*Total: ${U.money(s.total)}*`,
          `Paid: ${U.money(s.paid)}`,
          Number(s.pending)?`Balance Due: ${U.money(s.pending)}`:'',
          ``,
          st.invoiceFooter||''
        ].filter(Boolean).join('\n');
        const url = phone ? `https://wa.me/${phone.length===10?'91'+phone:phone}?text=${encodeURIComponent(lines)}`
                          : `https://wa.me/?text=${encodeURIComponent(lines)}`;
        window.open(url,'_blank');
        return true;
      }
      if(id==='duplicateSale'){
        const sid=(location.hash.split('/')[2]||'');
        const s=DB.find('sales',sid);
        if(!s)return true;
        const clone={...JSON.parse(JSON.stringify(s))};
        delete clone.id;delete clone.createdAt;
        clone.number=DB.nextNumber('INV',DB.data.settings.invoicePrefix||'INV');
        clone.date=U.today();clone.paid=0;clone.pending=clone.total;
        location.hash='#/sales';
        setTimeout(()=>Views.saleForm(clone),120);
        return true;
      }
      if(id==='salesExport'){
        U.downloadCSV('sales.csv',['Date','Invoice','Customer','Total','Paid','Pending','Status'],DB.all('sales').map(s=>[U.date(s.date),s.number||'',Views.customerName(s.customerId),s.total,s.paid,s.pending,Views.saleStatus(s)]));
        U.toast('✓ CSV exported','ok');return true;
      }
      if(id==='expExport'){
        U.downloadCSV('expenses.csv',['Date','Category','Description','Amount','Method'],DB.all('expenses').map(e=>[U.date(e.date),e.category,e.description||'',e.amount,e.method||'']));
        U.toast('✓ CSV exported','ok');return true;
      }
      if(id==='purExport'){
        U.downloadCSV('purchases.csv',['Date','ID','Supplier','Total','Paid','Pending'],DB.all('purchases').map(p=>[U.date(p.date),p.number||'',Views.supplierName(p.supplierId),p.total,p.paid,p.pending]));
        U.toast('✓ CSV exported','ok');return true;
      }
      if(id==='salesClear'){this.state.salesFilter={q:'',from:'',to:'',customerId:'',productId:''};this.route();return true}
      if(id==='expClear'){this.state.expFilter={q:'',from:'',to:'',category:''};this.route();return true}
      if(id==='delClear'){this.state.delFilter={status:'',from:'',to:''};this.route();return true}
      if(id==='logoutBtn'||id==='logoutBtn2'){this.logout();return true}
      if(id==='changePassBtn'){
        (async()=>{
          const email=this.fbUser?.email;
          if(!fbReady||!email){U.toast('Not signed in to the cloud','warn');return}
          try{await sendPasswordResetEmail(fbAuth,email);U.toast('Reset link sent to '+email,'ok')}
          catch(err){U.toast(authMsg(err),'err')}
        })();
        return true;
      }
      if(id==='syncNowBtn'){
        (async()=>{
          if(!Cloud.enabled){U.toast('Cloud sync is off (offline mode)','warn');return}
          Cloud.status='syncing';this.updateCloudBadge();
          await Cloud.push();
          U.toast(Cloud.status==='ok'?'✓ Synced to cloud':'Sync failed','ok');
        })();
        return true;
      }
      if(id==='backupBtn'){Views.exportAll('backup');return true}
      if(id==='restoreBtn'){document.getElementById('restoreFile').click();return true}
      if(id==='resetBtn'){this.factoryReset();return true}
      if(id==='clearLogo'){DB.data.settings.logo='';DB.save();this.route();return true}
      return false;
    };

    const self=this;
    view.onclick=(function(original){
      return function(e){
        const btn=e.target.closest('button, a');
        if(btn && btn.id && self._idHandlers(btn)) return;
        original.call(view,e);
      };
    })(view.onclick);

    /* ---------- live filter bindings ---------- */
    if(view.querySelector('#salesSearch')){
      this.state.salesFilter=this.state.salesFilter||{q:'',from:'',to:'',customerId:'',productId:''};
      document.getElementById('salesSearch').addEventListener('input',U.debounce(e=>{this.state.salesFilter.q=e.target.value;this.route()},320));
      [['salesFrom','from'],['salesTo','to'],['salesCustomer','customerId'],['salesProduct','productId']].forEach(([id,key])=>{
        const el=document.getElementById(id);
        if(el)el.addEventListener('change',()=>{this.state.salesFilter[key]=el.value;this.route()});
      });
    }
    if(view.querySelector('#expSearch')){
      this.state.expFilter=this.state.expFilter||{q:'',from:'',to:'',category:''};
      document.getElementById('expSearch').addEventListener('input',U.debounce(e=>{this.state.expFilter.q=e.target.value;this.route()},320));
      document.getElementById('expFrom').addEventListener('change',e=>{this.state.expFilter.from=e.target.value;this.route()});
      document.getElementById('expTo').addEventListener('change',e=>{this.state.expFilter.to=e.target.value;this.route()});
      document.getElementById('expCat').addEventListener('change',e=>{this.state.expFilter.category=e.target.value;this.route()});
    }
    if(view.querySelector('#delStatus')){
      this.state.delFilter=this.state.delFilter||{status:'',from:'',to:''};
      document.getElementById('delStatus').addEventListener('change',e=>{this.state.delFilter.status=e.target.value;this.route()});
      document.getElementById('delFrom').addEventListener('change',e=>{this.state.delFilter.from=e.target.value;this.route()});
      document.getElementById('delTo').addEventListener('change',e=>{this.state.delFilter.to=e.target.value;this.route()});
    }
    if(view.querySelector('#prodSearch'))document.getElementById('prodSearch').addEventListener('input',U.debounce(e=>{this.state.prodQ=e.target.value;this.route()},320));
    if(view.querySelector('#custSearch'))document.getElementById('custSearch').addEventListener('input',U.debounce(e=>{this.state.custQ=e.target.value;this.route()},320));
    if(view.querySelector('#suppSearch'))document.getElementById('suppSearch').addEventListener('input',U.debounce(e=>{this.state.suppQ=e.target.value;this.route()},320));

    const df=document.getElementById('dashFrom');const dt=document.getElementById('dashTo');
    if(df&&dt){const upd=()=>{this.state.range={key:'custom',from:df.value,to:dt.value};this.route()};df.addEventListener('change',upd);dt.addEventListener('change',upd)}
    const rf=document.getElementById('repFrom');const rt=document.getElementById('repTo');
    if(rf&&rt){const upd=()=>{this.state.reportRange={key:'custom',from:rf.value,to:rt.value};this.route()};rf.addEventListener('change',upd);rt.addEventListener('change',upd)}
    const cff=document.getElementById('cfFrom');const cft=document.getElementById('cfTo');
    if(cff&&cft){const upd=()=>{this.state.cfRange={key:'custom',from:cff.value,to:cft.value};this.route()};cff.addEventListener('change',upd);cft.addEventListener('change',upd)}

    /* ---------- settings forms ---------- */
    const sf=document.getElementById('settingsForm');
    if(sf){
      sf.addEventListener('submit',e=>{
        e.preventDefault();
        const v=UI.readForm(sf,[{name:'businessName'},{name:'ownerName'},{name:'phone'},{name:'email'},{name:'address'},{name:'gst'}]);
        if(!v.businessName){U.toast('Business name is required','err');return}
        Object.assign(DB.data.settings,v);DB.save();
        document.getElementById('topBizName').textContent=v.businessName;
        this.renderSidebar();U.toast('✓ Saved','ok');
      });
    }
    const invf=document.getElementById('invoiceForm');
    if(invf){
      invf.addEventListener('submit',e=>{
        e.preventDefault();
        const v=UI.readForm(invf,[{name:'invoicePrefix'},{name:'taxPercent',type:'number'},{name:'upiId'},{name:'bankName'},{name:'bankAccount'},{name:'bankIfsc'},{name:'bankBranch'},{name:'signatureName'},{name:'invoiceTerms'},{name:'invoiceFooter'}]);
        Object.assign(DB.data.settings,v);DB.save();U.toast('✓ Invoice settings saved','ok');
      });
    }
    const logoFile=document.getElementById('logoFile');
    if(logoFile){
      logoFile.addEventListener('change',async()=>{
        const f=logoFile.files[0];if(!f)return;
        if(f.size>500000){U.toast('Logo must be under 500 KB','err');return}
        const dataUrl=await U.fileToDataURL(f);
        DB.data.settings.logo=dataUrl;DB.save();U.toast('✓ Logo saved','ok');this.route();
      });
    }
    const pf=document.getElementById('prefsForm');
    if(pf){
      pf.addEventListener('submit',e=>{
        e.preventDefault();
        const v=UI.readForm(pf,[{name:'lowStockThreshold',type:'number'}]);
        Object.assign(DB.data.settings,v);DB.save();U.toast('✓ Preferences saved','ok');
      });
    }
    const rfInput=document.getElementById('restoreFile');
    if(rfInput){
      rfInput.addEventListener('change',()=>{
        const file=rfInput.files[0];if(!file)return;
        const reader=new FileReader();
        reader.onload=async()=>{
          try{
            const parsed=JSON.parse(reader.result);
            if(!parsed.settings||!Array.isArray(parsed.products))throw new Error('Invalid backup file.');
            const ok=await U.confirm('Restoring will REPLACE all current data. Continue?','Restore');
            if(!ok)return;
            DB.data=DB.normalize(parsed);DB.save();
            U.toast('✓ Backup restored','ok');
            this.refresh();
          }catch(err){U.toast('Invalid backup file.','err')}
        };
        reader.readAsText(file);
      });
    }
  },

  factoryReset:async function(){
    const ok=await U.confirm('This will permanently DELETE all business data on this device AND in the cloud. Continue?','Delete Everything');
    if(!ok)return;
    const check=await U.confirm('Are you absolutely sure? This cannot be undone.','Yes, Delete All');
    if(!check)return;
    DB.factoryReset();
    if(Cloud.enabled){ try{ await Cloud.push() }catch(e){} }
    U.toast('All data cleared','ok');
    setTimeout(()=>location.reload(),700);
  }
};

/* ============================================================
   BOOT
   ============================================================ */
function start(){ App.boot(); }
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start);
else start();

window.addEventListener('resize',U.debounce(()=>{
  if(App.currentView==='dashboard')Views.afterDashboard(App.state);
  if(App.currentView==='reports')Views.afterReports(App.state);
  if(App.currentView==='expenses')Views.afterExpenses();
  if(App.currentView==='cashflow')Views.afterCashflow(App.state);
},260));

window.addEventListener('online',()=>{ if(Cloud.enabled){Cloud.push();U.toast('Back online — syncing','ok')} });
window.addEventListener('offline',()=>{ U.toast('You are offline — changes will sync later','warn') });
</script>
</body>
</html>
